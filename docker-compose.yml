services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: liferentals
      MYSQL_USER: liferentals_user
      MYSQL_PASSWORD: liferentals_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    restart: always
    environment:
      DB_USER: liferentals_user
      DB_PASSWORD: liferentals_password
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: liferentals
      ALLOWED_ORIGINS: http://localhost,http://localhost:80
    ports:
      - "8000:7860"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
